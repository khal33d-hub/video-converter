name: Build installers

# Runs the tests and builds installers for Windows, macOS and Linux.
# Pushing a tag such as v1.0.1 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Converter-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | **Windows** (installer) | `Video-Converter-Setup-*.exe` |
            | **Windows** (no install, run from anywhere) | `Video-Converter-Portable-*.exe` |
            | **Mac** (Apple Silicon: M1 or newer) | `Video-Converter-*-mac.dmg` |
            | **Linux** | `.AppImage` (any distro) or `.deb` (Ubuntu/Debian) |

            ffmpeg is built in, so there's nothing else to install. See the README for first-launch tips.
