name: Build Windows installer

# Builds Video-Converter-Setup.exe and publishes it on the Releases page as
# the version in package.json. Pushing again with the same version replaces it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Video Converter ${{ steps.version.outputs.tag }}
          files: dist/Video-Converter-Setup.exe
          overwrite_files: true
          make_latest: true
          body: |
            Download **Video-Converter-Setup.exe** below and run it to install Video Converter on Windows.

            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.
